<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECAD — Advanced Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #0a0a0a;
  color: #f0ede6;
  font-family: 'Sora', sans-serif;
  font-weight: 300;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
}
:root {
  --silver:   #b8c8d6;
  --silver-l: #d4e2ec;
  --silver-d: #586878;
  --navy:     #162340;
  --navy-l:   #1e2e50;
  --black:    #0a0a0a;
  --s1:       #111111;
  --s2:       #181818;
  --s3:       #1e1e1e;
  --s4:       #232323;
  --border:   rgba(184,200,214,0.22);
  --bsoft:    rgba(255,255,255,0.06);
  --text:     #f0ede6;
  --muted:    #8a8378;
  --dim:      #5a574f;
  --green:    #4caf82;
  --green-d:  rgba(76,175,130,0.14);
  --red:      #cf5b5b;
  --red-d:    rgba(207,91,91,0.13);
  --amber:    #d4a843;
  --amber-d:  rgba(212,168,67,0.14);
  --copper:   #c9783c;
  --copper-l: #e8a46a;
}

/* ── LAYOUT ─────────────────────────────────────────────────────── */
.page-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.page-header {
  margin-bottom: 40px;
  border-bottom: 1px solid var(--bsoft);
  padding-bottom: 28px;
}
.page-header-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}
.back-btn {
  background: var(--s3);
  border: 1px solid var(--bsoft);
  color: var(--muted);
  font-family: 'Sora', sans-serif;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.back-btn:hover { color: var(--silver); border-color: var(--border); }
.page-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 300;
  color: var(--silver-l);
  letter-spacing: .04em;
}
.page-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.overall-progress-wrap {
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.overall-bar-bg {
  flex: 1;
  height: 5px;
  background: var(--s3);
  border-radius: 4px;
  overflow: hidden;
}
.overall-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--silver-d), var(--silver-l));
  border-radius: 4px;
  transition: width .6s ease;
}
.overall-pct {
  font-size: 12px;
  color: var(--silver);
  min-width: 42px;
  text-align: right;
}

/* ── TRACK LABELS ───────────────────────────────────────────────── */
.track-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 36px 0 14px;
}
.track-label:first-of-type { margin-top: 0; }

/* ── MODULE GRID ────────────────────────────────────────────────── */
.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
  margin-bottom: 6px;
}
.mod-card {
  background: var(--s1);
  border: 1px solid var(--bsoft);
  border-radius: 10px;
  padding: 22px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color .25s, transform .25s;
}
.mod-card:hover { border-color: var(--border); transform: translateY(-2px); }
.mod-card.done { border-color: rgba(76,175,130,.3); }
.mod-card.done::after {
  content: '✓';
  position: absolute;
  top: 14px; right: 16px;
  font-size: 13px;
  color: var(--green);
}
.mod-card.locked { opacity: .42; cursor: not-allowed; }
.mod-card.locked:hover { transform: none; border-color: var(--bsoft); }
.mod-ico { font-size: 22px; margin-bottom: 10px; }
.mod-stage {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--copper-l);
  margin-bottom: 6px;
}
.mod-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 400;
  color: var(--silver-l);
  margin-bottom: 6px;
  line-height: 1.3;
}
.mod-desc {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 12px;
}
.mod-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--bsoft);
  color: var(--dim);
}
.pill.quiz { border-color: rgba(212,168,67,.3); color: var(--amber); }
.pill.practice { border-color: rgba(184,200,214,.2); color: var(--silver-d); }
.pill.advanced { border-color: rgba(207,91,91,.3); color: var(--red); }

/* ── OVERLAY ────────────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  z-index: 200;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px 40px;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.lesson-panel {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 760px;
  padding: 36px 36px 40px;
  position: relative;
  margin-top: 20px;
}
.lesson-close {
  position: absolute;
  top: 18px; right: 20px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  transition: color .2s;
}
.lesson-close:hover { color: var(--silver); }
.lesson-stage {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--copper-l);
  margin-bottom: 6px;
}
.lesson-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 300;
  color: var(--silver-l);
  margin-bottom: 22px;
  line-height: 1.25;
}
.lesson-progress-wrap {
  background: var(--s3);
  border-radius: 6px;
  height: 5px;
  margin-bottom: 26px;
  overflow: hidden;
}
.lesson-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--silver-d), var(--silver-l));
  transition: width .5s ease;
  border-radius: 6px;
}

/* ── LESSON CONTENT ─────────────────────────────────────────────── */
.section-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--silver-d);
  margin: 26px 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--bsoft);
}
.section-lbl:first-child { margin-top: 0; }
.point {
  display: flex;
  gap: 12px;
  margin-bottom: 13px;
  align-items: flex-start;
}
.point-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--silver-d);
  margin-top: 8px;
  flex-shrink: 0;
}
.point-text { font-size: 13px; color: var(--text); line-height: 1.65; }
.point-text strong { color: var(--silver-l); font-weight: 500; }
.callout {
  background: var(--navy);
  border: 1px solid rgba(184,200,214,.18);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 12.5px;
  color: var(--silver);
  margin: 18px 0;
  line-height: 1.6;
}
.warn {
  background: var(--red-d);
  border: 1px solid rgba(207,91,91,.2);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: #e08080;
  margin: 14px 0;
  line-height: 1.55;
}
.tip {
  background: var(--amber-d);
  border: 1px solid rgba(212,168,67,.2);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--amber);
  margin: 14px 0;
  line-height: 1.55;
}

/* ── PRACTICE QUESTIONS ─────────────────────────────────────────── */
.pq-section {
  margin-top: 30px;
  padding-top: 22px;
  border-top: 1px solid var(--bsoft);
}
.pq-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 16px;
}
.pq-item {
  background: var(--s3);
  border: 1px solid var(--bsoft);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}
.pq-q {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 10px;
  font-weight: 400;
}
.pq-reveal-btn {
  background: none;
  border: 1px solid var(--bsoft);
  color: var(--silver-d);
  font-family: 'Sora', sans-serif;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.pq-reveal-btn:hover { color: var(--silver); border-color: var(--border); }
.pq-answer {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--silver);
  background: var(--s4);
  border-radius: 6px;
  padding: 10px 12px;
  display: none;
  line-height: 1.6;
}
.pq-answer.visible { display: block; }

/* ── QUIZ ───────────────────────────────────────────────────────── */
.quiz-section {
  margin-top: 30px;
  padding-top: 22px;
  border-top: 1px solid var(--bsoft);
}
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 18px;
}
.quiz-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--silver);
}
.quiz-pass-note {
  font-size: 10px;
  color: var(--muted);
}
.quiz-q-block { margin-bottom: 22px; }
.quiz-q-text {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 10px;
  font-weight: 400;
  line-height: 1.6;
}
.quiz-opts { display: flex; flex-direction: column; gap: 7px; }
.quiz-opt {
  background: var(--s3);
  border: 1px solid var(--bsoft);
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .2s, color .2s, background .2s;
  line-height: 1.5;
}
.quiz-opt:hover { border-color: var(--border); color: var(--text); }
.quiz-opt.selected { border-color: var(--silver-d); color: var(--silver-l); background: rgba(184,200,214,.07); }
.quiz-opt.correct { border-color: var(--green); color: var(--green); background: var(--green-d); cursor: default; }
.quiz-opt.wrong { border-color: var(--red); color: var(--red); background: var(--red-d); cursor: default; }
.quiz-feedback {
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  margin-top: 8px;
  display: none;
  line-height: 1.55;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: var(--green-d); color: var(--green); border: 1px solid rgba(76,175,130,.2); }
.quiz-feedback.err { background: var(--red-d); color: #e08080; border: 1px solid rgba(207,91,91,.2); }
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--navy-l), var(--navy));
  border: 1px solid rgba(184,200,214,.25);
  color: var(--silver-l);
  font-family: 'Sora', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 10px 22px;
  border-radius: 7px;
  cursor: pointer;
  letter-spacing: .04em;
  transition: border-color .2s, opacity .2s;
}
.btn-primary:hover { border-color: var(--silver-d); }
.btn-secondary {
  background: var(--s3);
  border: 1px solid var(--bsoft);
  color: var(--muted);
  font-family: 'Sora', sans-serif;
  font-size: 12px;
  padding: 10px 18px;
  border-radius: 7px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.btn-secondary:hover { color: var(--silver); border-color: var(--border); }
.score-display { font-size: 12px; color: var(--muted); }

.result-box {
  margin-top: 20px;
  background: var(--s3);
  border: 1px solid var(--bsoft);
  border-radius: 10px;
  padding: 22px;
  display: none;
}
.result-box.show { display: block; }
.result-score {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 300;
  color: var(--silver-l);
  line-height: 1;
  margin-bottom: 6px;
}
.result-label {
  font-size: 13px;
  color: var(--silver);
  margin-bottom: 6px;
  font-weight: 500;
}
.result-msg { font-size: 12px; color: var(--muted); line-height: 1.6; }
.result-pass .result-score { color: var(--green); }
.result-fail .result-score { color: var(--red); }

/* ── TOAST ──────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--s3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 12px;
  color: var(--silver);
  z-index: 999;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: rgba(76,175,130,.35); color: var(--green); }
.toast.err { border-color: rgba(207,91,91,.35); color: var(--red); }

@media (max-width: 600px) {
  .lesson-panel { padding: 24px 18px 30px; }
  .page-wrap { padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<div class="page-wrap">
  <!-- HEADER -->
  <div class="page-header">
    <div class="page-header-top">
      <a class="back-btn" href="dashboard.html">← Dashboard</a>
    </div>
    <div class="page-title">Advanced Training Centre</div>
    <div class="page-subtitle">Extra Clean Auto Detailing · Skills Development Programme</div>
    <div class="overall-progress-wrap">
      <div class="overall-bar-bg">
        <div class="overall-bar-fill" id="overall-bar" style="width:0%"></div>
      </div>
      <div class="overall-pct" id="overall-pct">0%</div>
    </div>
  </div>

  <div id="module-list"></div>
</div>

<!-- LESSON OVERLAY -->
<div class="overlay" id="overlay">
  <div class="lesson-panel" id="lesson-panel">
    <button class="lesson-close" onclick="closeLesson()">×</button>
    <div class="lesson-stage" id="l-stage"></div>
    <div class="lesson-title" id="l-title"></div>
    <div class="lesson-progress-wrap">
      <div class="lesson-progress-bar" id="l-progress" style="width:0%"></div>
    </div>
    <div id="l-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────
const MODULES = [

  // ══════════════════════════════════════════
  // TRACK: CRAFT & TECHNIQUE
  // ══════════════════════════════════════════
  {
    track: 'Craft & Technique',
    id: 'paint-science',
    stage: 'Advanced Craft',
    ico: '🎨',
    title: 'Paint Science & Correction Logic',
    desc: 'Understanding clearcoat, oxidation, swirl marks, and when correction is — and is not — the answer.',
    pills: ['advanced', 'practice', 'quiz'],
    content: `
      <div class="section-lbl">What You Are Actually Working On</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Modern vehicles have 4 layers:</strong> substrate (metal/plastic), electrocoat primer, base colour coat, and clearcoat. You are almost always working on the clearcoat. The colour coat beneath it is untouched in a correct detail.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Clearcoat thickness</strong> typically ranges 40–80 microns. Each polishing session removes 1–5 microns. This is not infinite. Knowing this prevents you from destroying a client's paint in the name of perfection.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Swirl marks</strong> are micro-scratches in the clearcoat surface that scatter light. They are caused by improper washing (dirty wash mitts, circular motion, dry wiping). Your wash technique either creates or prevents them.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Oxidation</strong> is UV-degraded clearcoat — the top layer has become chalky and lost its refractive ability. Mild oxidation responds to compound + polish. Severe oxidation means the clearcoat is failing. Flag it. You cannot restore what is gone.</div></div>
      <div class="section-lbl">Correction Hierarchy</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Light polish only</strong> — removes light swirl marks and haze. Low cut, low heat. Starting point for newer or well-maintained paint.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Compound then polish</strong> — compound cuts deeper to remove heavy swirls, light scratches, oxidation. Polish removes the compounding micro-marring. Two-stage process.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Wet sand then compound then polish</strong> — for severe orange peel, heavy scratches, severe oxidation. This is specialist work. Do not offer this until you have 20+ hours of deliberate DA polisher practice.</div></div>
      <div class="warn">⚠ A scratch that catches your fingernail has broken through the clearcoat into the colour coat. No amount of polishing will remove it. Managing client expectations at the assessment stage is the professional response — not a promise you cannot deliver.</div>
      <div class="section-lbl">Jamaican Paint Considerations</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>UV intensity</strong> in Jamaica accelerates clearcoat degradation. Vehicles that are parked outdoors, unprotected, age faster than equivalent mileage vehicles in temperate climates. Expect more oxidation on older fleet vehicles.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Surface temperature</strong> — compounds and polishes behave differently on hot panels. Heat accelerates the abrasive cycle, meaning you remove more material faster. Always work cool, shaded panels. Early morning is preferred.</div></div>
      <div class="callout">When a DA polisher enters your kit, your service scope expands significantly. Until then, your role in paint correction is accurate assessment and honest limitation — both of which are professional, billable skills.</div>
    `,
    practice: [
      { q: 'A client asks you to "just buff out" a scratch on their bonnet. You run your fingernail across it and it catches. What do you tell them, and why?', a: 'You explain honestly that the scratch has broken through the clearcoat, meaning the colour coat is exposed. Polishing or buffing cannot restore what is missing — it would only risk damaging the surrounding clearcoat. The correct solution is touch-up paint or a body shop. Document this during the pre-job walk-around and have the client acknowledge it before you begin any work on the vehicle.' },
      { q: 'Why does compound always need to be followed by polish on a two-stage correction?', a: 'Compound contains larger abrasive particles that cut into the clearcoat to remove defects — but they leave their own micro-scratches (marring) on the surface. Polish uses finer abrasives to remove those compound marks and restore optical clarity. Skipping the polish stage leaves the paint looking dull or hazy even though the original defect was corrected.' },
      { q: 'A client\'s vehicle has been sitting outside unprotected for 3 years in Kingston. The bonnet feels rough and chalky. Before touching it, what do you assess and document?', a: 'Assess the severity of oxidation (mild chalky haze vs. severe breakdown), check whether the clearcoat is peeling or failing at edges, run a fingernail across the surface to gauge depth, photograph every panel in natural light before work begins, and note any areas where the clearcoat is cracking or lifting. Communicate clearly what correction is possible vs. what indicates structural paint failure.' }
    ],
    quiz: [
      { q: 'A client has a 2015 Toyota Vitz with heavy swirl marks across all panels. You currently have a DA polisher. What is the correct correction sequence?', opts: ['Light polish only — swirls are not deep enough for compound', 'Compound all panels, then polish to remove compound marring', 'Wet sand first, then compound, then polish', 'Apply a sealant to fill in the swirls visually'], correct: 1, feedback: ['Light polish alone may not cut deep enough to fully remove heavy swirls.', 'Correct. Heavy swirls need compound to cut them out, followed by polish to restore gloss.', 'Wet sanding is reserved for severe orange peel or deep scratches — overkill for swirl marks.', 'Sealants fill swirls temporarily. This is not correction — and it is dishonest to present it as such.'] },
      { q: 'You are polishing a black sedan bonnet at 11am in Kingston. The panel feels very warm. What should you do?', opts: ['Continue — the heat helps activate the polish chemistry', 'Work faster to minimise contact time', 'Stop. Cool the panel with water, move to shade, wait for the surface to cool before continuing', 'Switch to a coarser compound to finish faster'], correct: 2, feedback: ['Heat does not activate polish beneficially — it accelerates abrasion unpredictably and can cause product to dry and bind.', 'Speed on a hot panel increases heat from friction and removes the ability to monitor product behaviour.', 'Correct. A hot panel is an unsafe polishing surface. Cool, shaded conditions are non-negotiable for quality correction work.', 'Coarser compound on a hot panel dramatically increases the risk of clearcoat damage.'] },
      { q: 'What does oxidation on a vehicle\'s paint actually mean?', opts: ['The metal beneath the paint has rusted through', 'UV radiation has degraded the clearcoat surface, making it chalky and unable to reflect light properly', 'The colour coat has faded due to washing too frequently', 'The vehicle has been waxed with an incompatible product'], correct: 1, feedback: ['Oxidation is a surface clearcoat issue, not rust — rust is metal corrosion beneath the paint system.', 'Correct. UV breaks down the polymer chains in the clearcoat. The result is a chalky, dull surface that has lost its refractive ability.', 'Over-washing does not cause oxidation — UV exposure and lack of protection do.', 'Product incompatibility causes bonding or application issues, not oxidation.'] },

  {

    desc: 'Two-bucket method, dwell time, contact sequence, and the habits that separate pros from amateurs.',
    pills: ['practice', 'quiz'],
    content: `
      <div class="section-lbl">The Two-Bucket Method — Why It Is Not Optional</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Bucket 1: wash solution.</strong> Bucket 2: rinse water with a grit guard at the bottom. Every pass of the mitt: rinse in Bucket 2, agitate against the grit guard, load with soap from Bucket 1. This sequence keeps abrasive particles from returning to the paint surface.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Without the two-bucket method</strong>, each rinse of your wash mitt reloads it with the contamination you just removed. You are then scrubbing that contamination back across the paint — creating the exact swirl marks your clients are paying you to avoid.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Mitt pressure.</strong> Let the mitt do the work. Firm pressure does not clean better — it forces abrasive particles deeper into the paint surface. Light, overlapping straight-line passes.</div></div>
      <div class="section-lbl">Contact Sequence</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Wheels and arches first</strong> — these carry the heaviest contamination. Complete them before touching body panels. Use dedicated brushes and a separate mitt. Never use a wheel brush on paint.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Pre-rinse the vehicle</strong> — high pressure to remove loose contamination before any contact. Start from the roof down. This is not optional — contact washing a dry, dusty vehicle is how swirl marks are made.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Wash sequence: roof → glass → upper panels → lower panels → sills.</strong> Work top-down always. Lower panels carry the most contamination. If you wash them first and reuse the same path, you drag that contamination up.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Foam cannon pre-wash</strong> — where used, apply foam, allow 3–5 minutes dwell time (not in direct sun — foam dries into a residue problem), then rinse before contact washing. The foam softens and lubricates bonded contamination, reducing the force your mitt needs to apply.</div></div>
      <div class="section-lbl">Drying Without Damage</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Waffle-weave microfibre only</strong> — this traps water in its structure rather than smearing it across the surface. Never use chamois leather on modern clearcoat — the dragging action at the molecular level creates marring.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Blower first</strong> — remove water from panel gaps, mirrors, badges, door jams. Water hiding in these areas migrates onto panels after drying and leaves water marks. Your blower is a professional tool, not just convenience.</div></div>
      <div class="tip">💡 In Jamaica's heat, drying speed is your enemy. Work in the shade. A vehicle dried in direct afternoon sun will water-spot before your towel reaches the second panel. Time your wash completion so you are drying in shade or after the worst heat has passed.</div>
      <div class="callout">Wash technique is where your reputation is built or damaged. A client does not see your product chemistry — they see swirl marks under sunlight two days after you left. Perfect wash technique is invisible. Imperfect wash technique is permanent.</div>
    `,
    practice: [
      { q: 'Explain to a new assistant why you always wash the wheels before the body panels, using separate tools for each.', a: 'Wheels carry brake dust, road tar, and heavy grit — the most abrasive contamination on the vehicle. If you wash the body panels first and then move to the wheels, you risk splashing wheel contamination onto freshly cleaned paint. Using a dedicated wheel brush and mitt prevents cross-contamination: abrasive particles from the wheels never touch your paint wash mitt, which protects the clearcoat from the microscopic scratching that creates swirl marks.' },
      { q: 'A client watches you work and says "why are you using two buckets? Seems like extra work." How do you explain it without being condescending?', a: 'You explain that the second bucket is the rinse bucket — every time you pull the mitt off the paint, you rinse it in the second bucket and scrub it against the grit guard at the bottom. That removes any grit or dirt the mitt picked up. If you rinsed the mitt back into the soap bucket, you\'d be reloading it with the same contamination you just removed, then scrubbing it back onto the paint. The two-bucket method is what keeps the wash from creating new scratches.' },
      { q: 'You arrive at a client\'s home at 1pm. The vehicle is parked in direct sun and is very hot to the touch. What do you do before you begin washing?', a: 'Do not begin washing on a hot, sun-baked vehicle. Ask the client if the vehicle can be moved to shade — if not, wait for a cooler part of the day or reschedule. Washing a hot vehicle causes shampoo and foam to dry rapidly onto the surface before you can rinse it, leaving chemical residue. The heat also accelerates water evaporation during drying, causing water spotting on every panel. Schedule around the sun, not in spite of it.' }
    ],
    quiz: [
      { q: 'You have rinsed your wash mitt in the wash bucket (not the rinse bucket) during a job. What is the most likely outcome if this continues?', opts: ['No impact — shampoo neutralises contamination', 'Contamination from the paint is reloaded onto the mitt and scrubbed back across the clearcoat, creating swirl marks', 'The wash just takes slightly longer', 'The shampoo dilutes and loses effectiveness'], correct: 1, feedback: ['Shampoo lubricates but does not neutralise abrasive particles — grit reloaded onto the mitt will scratch.', 'Correct. This is the exact mechanism by which swirl marks are created during washing. The two-bucket method exists entirely to prevent this.', 'The consequence is paint damage, not just time loss.', 'Dilution is a real concern but the primary risk here is abrasive recontamination.'] },
      { q: 'In Jamaica\'s afternoon heat, you apply foam pre-wash and wait 10 minutes before rinsing. What problem does this create?', opts: ['No problem — longer dwell improves contamination removal', 'The foam dries onto the paint in the heat, creating a residue that requires additional work to remove', 'The foam becomes more effective as it concentrates', 'Wheels must be re-treated after long foam dwell times'], correct: 1, feedback: ['Dwell time guidelines assume normal conditions. Heat dramatically shortens the safe dwell window.', 'Correct. Dried foam leaves a concentrated chemical residue on the surface that must be rinsed and re-cleaned — adding work and risking surface chemistry issues.', 'Concentrated dried foam is a contaminant, not an improvement.', 'Wheel treatment is a separate process — foam drying is a panel-specific risk.'] },
      { q: 'Why should a blower be used before drying towels on a freshly washed vehicle?', opts: ['To heat the panels for better towel absorption', 'To remove water from panel gaps and seams that would otherwise migrate onto dried panels and create water marks', 'Blowers are only for interiors — not exterior drying', 'To activate the sealant applied during washing'], correct: 1, feedback: ['Panel heat is a problem, not a goal, during the drying phase.', 'Correct. Door jams, badge edges, mirror housings, and panel gaps hold water that drips onto clean panels minutes after drying — creating marks on a vehicle you just finished.', 'A blower is a core exterior drying tool for any professional detailer.', 'No sealant is applied during the wash stage.'] },
      { q: 'What does "straight-line overlapping passes" mean during contact washing, and why does it matter?', opts: ['Washing in parallel lines rather than circles, so any micro-scratches created align with light reflection and are less visible', 'Washing in a grid pattern to ensure full coverage', 'Applying more pressure in straight lines to clean better', 'A pattern only relevant during machine polishing'], correct: 0, feedback: ['Correct. Circular motion creates circular micro-scratches that scatter light in all directions — creating visible swirl halos. Straight-line scratches are far less visible because they align directionally.', 'Coverage is important but the direction rationale is specifically about scratch visibility.', 'Pressure is a separate concern — straight-line means direction, not force.', 'Straight-line technique applies to both hand washing and machine polishing.'] },
      { q: 'A client\'s vehicle has heavy road tar on the lower panels. You begin contact washing and the wash mitt drags noticeably. What should you do?', opts: ['Apply more shampoo and push through — the soap will dissolve it', 'Stop contact washing that area. Apply a dedicated tar remover, allow it to dwell, and wipe off before continuing the wash', 'Use a stiffer brush to agitate the tar', 'Switch to a compound pad to cut through it'], correct: 1, feedback: ['Shampoo does not dissolve petroleum-based tar — forcing the mitt across it embeds abrasive tar particles into the clearcoat.', 'Correct. Tar requires a dedicated chemical solvent applied as a pre-treatment. Contact washing before chemical removal causes paint damage.', 'A stiff brush on painted lower panels is clearcoat damage waiting to happen.', 'Compound is a paint correction tool — not a decontamination solution.'] }
    ]

  {
  track: 'Craft & Technique',
  id: 'rag-care',
  stage: 'Foundational',
  ico: '🧺',
  title: 'Microfiber & Rag Care Protocol',
  desc: 'The laundering system that protects every job after this one — how contamination hiding in a towel becomes a scratch on a client\'s paint.',
  pills: ['practice', 'quiz'],
  content: `
    <div class="section-lbl">Why This Is Not Housekeeping — It's Quality Control</div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Every principle you already follow during the wash applies again in the laundry.</strong> You never let a wheel brush touch paint because wheel contamination is abrasive. That same abrasive grit does not disappear when the towel goes in the wash — it just waits for the next load to cross-contaminate a different towel.</div></div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>The client never sees the cause.</strong> A swirl mark from bad laundering looks identical to one from bad wash technique. It shows up two days later under sunlight, with no way to trace it back to a load of mixed towels. This makes it more dangerous than a technique error — you can't self-correct what you can't see happening.</div></div>

    <div class="section-lbl">The Three-Load Rule</div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Load 1 — Wheels, tires, tar.</strong> Heaviest and most abrasive contamination (brake dust, road tar, grit). These towels never enter the same wash as anything that touches paint or interior.</div></div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Load 2 — Exterior paint.</strong> Wash mitts and drying microfibers. Kept separate from wheel towels for the same reason a wheel brush never touches a body panel.</div></div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Load 3 — Interior & glass.</strong> APC cloths, leather cloths, glass microfibers. These are the towels most likely to end up back against a client's skin, dashboard, or seat — the highest standard applies here.</div></div>
    <div class="tip">💡 Color-code each load with a dedicated towel color (e.g. dark grey for wheels, silver for paint, white for interior/glass). This removes guesswork entirely — including for a future hire who doesn't yet have your judgment for what's "probably fine."</div>

    <div class="section-lbl">Detergent & Wash Settings</div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Use a dedicated microfiber detergent</strong> — P&S Rags to Riches or equivalent. General laundry detergent leaves surfactant residue in the fibers that transfers back onto paint as streaking on the next job.</div></div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Warm water, every load, no exceptions.</strong> Cold water will not break down embedded wax, sealant, and polymer residue. The detergent is formulated to work at warm temperatures — running it cold means you're not getting what you paid for.</div></div>
    <div class="warn">⚠ Never use fabric softener or dryer sheets on any detailing towel. Both coat the fiber with a waxy residue that kills absorbency — the exact opposite of what the towel is for. A "soft" towel that doesn't absorb water is a useless towel that still looks fine in the bag.</div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Never wash microfiber with cotton or other fabric types.</strong> Lint and fibers from cotton shed into the wash and embed in the microfiber, creating the exact kind of trapped grit you're trying to eliminate.</div></div>

    <div class="section-lbl">Drying</div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Air dry / hang dry is the standard — and the correct one.</strong> If a dryer is ever used, low heat only, and never with a dryer sheet in the drum.</div></div>
    <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Dry away from dust and open work areas.</strong> A clean towel hung in a garage where you're mixing chemicals or sweeping defeats the purpose of laundering it in the first place.</div></div>

    <div class="callout">The two-bucket method exists so contamination never travels backward onto clean paint during the job. The three-load rule exists so it never travels forward into the next job. Same principle, different stage of the process.</div>
  `,
  practice: [
    { q: 'A new hire asks why you have three different colored bins for dirty towels instead of just tossing them all in one hamper. Explain it in a way that would make sense to someone who has never detailed a car.', a: 'Each color represents a different level of contamination — wheel towels pick up brake dust and grit, paint towels touch the clearcoat, and interior towels touch things the client sits on and breathes near. If they all wash together, the grit from the wheel towels gets carried in the water and can embed itself in the paint or interior towels. The next time you use that "clean" towel, you\'re actually dragging that grit across a surface — which is exactly how scratches get created without you doing anything wrong during the job itself.' },
    { q: 'You\'re almost out of dedicated microfiber detergent and have regular laundry detergent at home. Should you substitute it for tonight\'s load? Explain your reasoning.', a: 'No. Regular detergent isn\'t formulated to fully rinse out of microfiber\'s dense fiber structure — it leaves surfactant residue behind. That residue transfers onto the next vehicle\'s paint as streaking, which undoes the polish or sealant work and creates a visible defect the client will notice. It\'s better to skip washing that load until proper detergent is available than to risk contaminating every towel in it.' }
  ],
  quiz: [
    { q: 'Why should wheel/tar towels never be washed in the same load as paint or interior towels?', opts: ['It just takes longer to sort them', 'Abrasive contamination from wheels can transfer in the wash and embed in towels that later touch paint or interior surfaces', 'Wheel towels need hotter water than paint towels', 'There is no real difference — this is just a preference'], correct: 1, feedback: ['Sorting time is irrelevant compared to the actual risk.', 'Correct. This is the same cross-contamination principle as never using a wheel brush on paint — just applied at the laundry stage instead of the job stage.', 'Water temperature should be consistent (warm) across all detailing loads, not split by towel type.', 'This is a quality-control principle with a direct mechanism, not a stylistic preference.'] },
    { q: 'What does fabric softener do to a microfiber towel?', opts: ['Nothing — it is safe and recommended for microfiber', 'It coats the fibers with residue that kills absorbency', 'It only affects color, not performance', 'It is required to restore softness after multiple washes'], correct: 1, feedback: ['Fabric softener is specifically warned against by every microfiber detergent manufacturer for a reason.', 'Correct. A "soft-feeling" towel that has lost its absorbency is now a worse tool than a rough one that still performs — softness is not the goal, function is.', 'The damage is functional, not just cosmetic.', 'Dedicated microfiber detergent restores softness without this trade-off — softener is never the answer.'] },
    { q: 'Why is warm water specified instead of cold for washing detailing towels?', opts: ['Warm water is just a general laundry default', 'Cold water will not break down embedded wax, sealant, and polymer residue the way the detergent is formulated to work', 'Warm water prevents shrinkage', 'It makes no measurable difference'], correct: 1, feedback: ['This is a specific formulation requirement, not a default habit.', 'Correct. Running a warm-water-formulated detergent on cold means the residues the detergent is designed to strip out simply stay in the towel.', 'Shrinkage is not the relevant concern for microfiber blends here.', 'The difference shows up directly as reduced absorbency and residue carryover on the next job.'] }

  {
    track: 'Craft & Technique',
    id: 'matte-satin-care',
    stage: 'Core Skill',
    ico: '⬛',
    title: 'Matte & Satin Finish Care',
    desc: 'The one rule that overrides everything else you know about paint correction: on a matte car, you cannot polish out a scratch. Doing so is how the finish gets permanently ruined.',
    pills: ['practice', 'quiz'],
    content: `
      <div class="section-lbl">The Rule That Changes Everything</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Matte and satin finishes are not glossy paint with a duller look — they are a physically different clearcoat.</strong> Gloss paint's clearcoat is smooth and reflective; matte clearcoat is manufactured with a textured, light-scattering finish baked in. Polishing or compounding a matte panel does not restore anything — it mechanically smooths that texture, and a smoothed matte clearcoat reflects light like gloss paint. You do not fix a scratch this way. You create a permanent glossy patch in the middle of a matte panel that cannot be undone by any product or technique in your kit.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>This means the entire correction hierarchy you use on gloss paint — light polish, compound then polish, wet sand then compound then polish — does not apply here at all.</strong> Applying any of it to a matte panel is not "trying and seeing" — it is a guaranteed, irreversible defect the moment the pad touches the surface.</div></div>
      <div class="warn">⚠ If a matte or satin vehicle has a scratch deep enough to catch a fingernail, the honest answer is that it needs a panel respray, not detailing correction. Setting this expectation at assessment, before any work begins, is the professional response — the same principle as flagging clearcoat-through scratches on gloss paint, just with a lower threshold and zero correction options available to you.</div>
      <div class="section-lbl">Washing a Matte Vehicle</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Two-bucket method and pH-neutral shampoo still apply</strong> — matte paint is not exempt from swirl marks or contamination damage, it is simply unable to have them corrected afterward. If anything, wash discipline matters more here because there is no polishing safety net if you get it wrong.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Never use a wax, gloss-enhancing sealant, or a standard ceramic coating not specifically formulated for matte finishes.</strong> Most sealants and waxes are designed to add reflection and depth — exactly what destroys a matte look. A product line without an explicit "matte-safe" or "for matte/satin finishes" label should be assumed unsafe for this surface until confirmed otherwise.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Dry with a clean, dedicated microfiber — never a chamois.</strong> Chamois leather is designed to leave a slight shine on gloss paint. On matte, that same effect reads as an obvious, uneven sheen patch.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Clay bar decontamination is generally avoidable on matte finishes unless genuinely necessary,</strong> and if used, requires a matte-safe lubricant and light pressure only. Standard clay lubricants can leave a residue that shows as gloss unevenness once it dries.</div></div>
      <div class="section-lbl">The Overspray Risk Most Detailers Miss</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Tyre dressing and standard trim/plastic restorer overspray is a real threat to an adjacent matte panel.</strong> A glossy mist landing on a matte fender or rocker panel is difficult to fully remove and immediately visible. Mask or work with deliberate care any time you are dressing tyres or trim near a matte-painted section.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>This applies to wheel sealants too</strong> — see the Wheel & Rim Types module for how this connects when a client has both matte paint and a specific rim finish that also needs product-matching care.</div></div>
      <div class="section-lbl">Setting Client Expectations</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Matte-finish owners often do not know their own paint's limitations.</strong> Many assume "detailing" universally includes scratch removal, because that is true for the gloss vehicles most people are used to. Explaining this clearly and calmly at assessment — before the vehicle is touched — protects both the client's expectations and your reputation.</div></div>
      <div class="callout">The skill here is not a new technique to add to your kit — it is the discipline to recognise a matte finish immediately and mentally remove "polish" and "compound" from your available options before you even open your kit. The client's trust depends on you knowing this before they do.</div>
    `,
    practice: [
      { q: 'A client with a matte-grey vehicle asks you to "buff out" a light scratch on the door. Walk through how you respond.', a: 'Explain clearly that matte clearcoat cannot be polished or compounded the way gloss paint can — doing so would smooth the textured finish and create a permanent glossy patch exactly where the scratch is, which is worse and irreversible. If the scratch catches a fingernail, the honest answer is that only a respray of that panel would resolve it. This should be explained before any work begins, not discovered mid-job.' },
      { q: 'You are about to apply tyre dressing on a vehicle with matte-black lower fenders. What extra care does this specific vehicle require compared to a gloss vehicle?', a: 'Extra care against overspray. A glossy mist of tyre dressing landing on a matte panel is difficult to remove and highly visible as an uneven sheen patch. On a gloss vehicle this same overspray is a minor, easily wiped inconvenience — on matte, it is a visible defect that may not fully correct.' },
      { q: 'Why does the standard paint correction hierarchy (light polish, compound then polish, wet sand then compound then polish) not apply to matte finishes at all?', a: 'Because matte clearcoat achieves its look through a manufactured texture, not a lack of polish. Any polishing or compounding action smooths that texture, converting the panel to a glossy finish in the treated area — which is the opposite of correction. There is no "light" version of this that is safe; the entire hierarchy assumes a smooth clearcoat that matte finishes do not have.' }
    ],
    quiz: [
      { q: 'Why can a scratch on a matte-finish panel not be polished out the way it could on gloss paint?', opts: ['Matte paint is simply too thin to polish', 'Polishing smooths the manufactured texture that creates the matte look, leaving a permanent glossy patch', 'Matte paint requires a special polish not available locally', 'It actually can be polished out using the same technique as gloss paint'], correct: 1, feedback: ['Thickness is not the relevant factor — texture is.', 'Correct. The matte look comes from texture, not thinness. Smoothing that texture creates gloss exactly where you polished.', 'No polish product resolves this — the issue is mechanical, not a product gap.', 'This is the core mistake this module exists to prevent. Never attempt it.'] },
      { q: 'Which product is safe to apply to a matte-finish vehicle without research first?', opts: ['Any wax or gloss-enhancing sealant in your current kit', 'A product explicitly labelled matte-safe or formulated for matte/satin finishes', 'Standard Cerakote ceramic sealant, since it works on all your other jobs', 'Chamois leather, since it dries fastest'], correct: 1, feedback: ['Standard waxes and gloss sealants are specifically designed to add the reflection matte finishes are meant to avoid.', 'Correct. Assume unsafe until a product explicitly confirms matte/satin compatibility.', 'Your standard ceramic sealant is formulated for gloss enhancement — wrong tool for this surface.', 'Chamois leaves a slight shine that reads as an obvious defect on matte paint.'] },
      { q: 'A client\'s matte vehicle has a deep scratch that catches a fingernail. What is the professional response?', opts: ['Attempt a light polish first to see if it helps', 'Explain that this requires a panel respray, since no detailing technique can correct it on this finish', 'Apply extra ceramic sealant to hide it', 'Use a rubbing compound since the finish is already damaged'], correct: 1, feedback: ['There is no safe "light" attempt here — any polishing action creates a permanent glossy patch.', 'Correct. This is the honest, professional answer — and it should be given at assessment, not discovered mid-job.', 'Sealant does not fill or hide a scratch of this depth on any finish.', 'Compound is a correction tool for gloss clearcoat — it is not a safe option on matte at any severity.'] },
      { q: 'Why does tyre dressing overspray pose a specific risk on matte-painted vehicles?', opts: ['It does not — overspray behaves identically on all finishes', 'A glossy overspray mist is difficult to remove and highly visible against a matte surface', 'Matte paint is more chemically reactive to dressing products', 'Overspray only affects chrome trim, not paint'], correct: 1, feedback: ['The visual and removal difficulty is genuinely different by finish type.', 'Correct. The same overspray that is a minor wipe-off on gloss paint is a visible, hard-to-fully-correct defect on matte.', 'The issue is visual/mechanical (a gloss film on a matte surface), not a chemical reaction.', 'Overspray affects any nearby surface, painted or otherwise — trim is not uniquely at risk.'] }
    ]
  },
  {
    track: 'Craft & Technique',
    id: 'wheel-rim-types',
    stage: 'Foundational',
    ico: '⚙️',
    title: 'Wheel & Rim Types: Materials, Finishes & Risk',
    desc: 'Not every rim can take the same cleaner. Knowing the finish in front of you before you touch it is what separates a safe wheel clean from an expensive mistake.',
    pills: ['practice', 'quiz'],
    content: `
      <div class="section-lbl">Why This Matters Before You Pick Up a Brush</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>A wheel is a finish, just like paint is a finish — and different finishes tolerate different chemicals and pressure.</strong> The same acid-based "hot rims" style wheel cleaner that is safe on some bare or heavily-coated wheels can strip clear coat or pit chrome on others. Identifying the finish before selecting a product is the same discipline as checking paint condition before choosing a correction step.</div></div>
      <div class="section-lbl">Common Rim Types You Will See</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Clear-coated alloy</strong> — by far the most common modern wheel. A thin factory clearcoat sits over the alloy, essentially a miniature paint job. Treat it with the same respect as body paint: pH-balanced or non-acid cleaner only, no abrasive pads. Acid-based cleaners degrade this clearcoat over repeated use, leading to dulling, pitting, and eventual peeling.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Painted steel or alloy wheels</strong> — a solid painted finish, common on work vehicles and older or economy models. Vulnerable to chipping from curb contact and abrasive pad damage. Same pH-safe cleaner logic as clear-coated alloy.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Polished / chrome wheels</strong> — a bare or plated reflective metal surface. Chrome is particularly vulnerable to pitting and corrosion from harsh acid cleaners used repeatedly over time. A one-time exposure may show no visible damage; the risk is cumulative across many washes.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Diamond-cut / machined-face wheels</strong> — a lathe-cut bare aluminum face with only a very thin clearcoat protecting it, paired with a painted background color. This thin clear layer is the most fragile finish you will regularly encounter. Any abrasive pad or harsh chemical on the machined lip risks breaking through to bare aluminum, which then shows as white, chalky corrosion that cannot be polished away — only refinished professionally.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Powder-coated wheels</strong> — a durable, baked-on coating, often in matte, satin, or bold custom colors. Generally more chemical-resistant than clearcoat, but matte/satin powder-coat finishes carry the exact same gloss-overspray risk covered in the Matte & Satin Finish Care module — a glossy tyre or wheel dressing product can leave visible sheen on a matte-coated rim.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Plastic wheel covers / hub caps</strong> — common on economy vehicles with steel wheels underneath. Cosmetically look like alloy but are much easier to scratch or crack, and clips can be damaged by aggressive brush agitation at the edges.</div></div>
      <div class="warn">⚠ If you cannot visually confirm the wheel finish with confidence — bare metal, clear-coated, powder-coated, or painted — default to your safest, most pH-neutral option. Guessing wrong with an acid-based cleaner is not a mistake you can undo.</div>
      <div class="section-lbl">The Safe Default Sequence</div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Your existing Turtle Wax Wheel Prep → Cerakote Wheel Sealant → Cerakote Tyre Coat sequence is already the safe, pH-balanced approach</strong> that works correctly across nearly all these finish types. The skill this module adds is not a new product — it is recognising when a wheel's finish demands even more caution than your standard sequence already provides, particularly diamond-cut and chrome wheels under repeated, long-term service.</div></div>
      <div class="point"><div class="point-dot"></div><div class="point-text"><strong>Contaminated wheels reject sealant regardless of finish type</strong> — decontamination first is universal across every rim type in this list, same as the principle already established in the Paint Protection & Sealants module.</div></div>
      <div class="callout">You do not need a different product for every wheel type — you need to correctly identify which finish you are looking at, and know which ones tolerate the least room for error. Chrome and diamond-cut wheels are the two that punish a wrong guess the most.</div>
    `,
    practice: [
      { q: 'You arrive at a job and the client\'s wheels have a lathe-cut, two-tone look — a machined silver face with a painted dark background. What finish is this, and what specific caution does it require?', a: 'This is a diamond-cut / machined-face wheel. The machined face has only a very thin clearcoat over bare aluminum, making it the most fragile finish commonly encountered. Abrasive pads or harsh acid-based cleaners risk breaking through that thin clear layer, exposing bare aluminum to corrosion that shows as white, chalky pitting — which cannot be polished away and requires professional refinishing to correct.' },
      { q: 'A returning client has satin-finish powder-coated wheels. What connects the care of these wheels to the Matte & Satin Finish Care module?', a: 'The same overspray risk applies. A glossy tyre dressing or standard wheel sealant can leave a visible sheen on a matte or satin powder-coated wheel, just as it can on matte body paint. The finish type — not just the surface it happens to be on — is what determines the product and technique risk.' },
      { q: 'You are not certain whether a wheel is bare polished aluminum or a clear-coated alloy. How should this uncertainty change your product choice?', a: 'Default to the safest, most pH-neutral option available rather than guessing with a stronger acid-based cleaner. An acid-based product is far more likely to cause irreversible damage — pitting on bare/chrome metal or clearcoat degradation on coated alloy — than a gentle pH-balanced cleaner is to under-perform. When identification is uncertain, caution costs you a slightly less dramatic clean; a wrong guess costs the client\'s wheel finish.' }
    ],
    quiz: [
      { q: 'Which wheel type generally has the LEAST tolerance for abrasive pads or harsh acid-based cleaners?', opts: ['Painted steel wheels', 'Diamond-cut / machined-face wheels', 'Powder-coated wheels', 'Plastic wheel covers'], correct: 1, feedback: ['Painted steel is vulnerable to chipping, but not as fragile as a machined face.', 'Correct. The thin clearcoat over bare aluminum on the machined face is the most fragile finish on this list — a breakthrough exposes bare metal to corrosion that cannot be polished out.', 'Powder-coat is actually one of the more chemical-resistant finishes.', 'Wheel covers are vulnerable to cracking and clip damage, not primarily to chemical attack.'] },
      { q: 'Why is an acid-based "hot rims" style wheel cleaner risky to use as a universal default across all wheel types?', opts: ['It is always too weak to clean effectively', 'It can strip clearcoat from coated alloy wheels and pit chrome over repeated use, even if a single use shows no visible damage', 'It only works on plastic wheel covers', 'There is no real risk — acid cleaners are safe on every finish'], correct: 1, feedback: ['Acid-based cleaners are typically strong, not weak — that is exactly the risk.', 'Correct. The damage from acid-based cleaners is frequently cumulative, meaning a wheel can look fine after one wash and show damage only after repeated exposure.', 'Plastic wheel covers have no particular relationship to acid-based cleaner suitability.', 'This is precisely the assumption this module exists to correct.'] },
      { q: 'You cannot confidently identify whether a wheel is bare chrome or clear-coated alloy. What is the correct approach?', opts: ['Use the strongest cleaner available to ensure a thorough clean', 'Default to your safest, most pH-neutral cleaning option', 'Skip cleaning the wheels entirely to avoid any risk', 'Ask the client to identify the finish themselves before proceeding'], correct: 1, feedback: ['The strongest option is exactly the wrong move under uncertainty — this risks irreversible damage.', 'Correct. When identification is uncertain, the safer, gentler option protects the client\'s wheels at the cost of a slightly less aggressive clean.', 'Skipping the wheels entirely is not a real option for a paid detailing service.', 'Most clients will not know this level of technical detail about their own wheels — the responsibility sits with you to assess visually.'] },
      { q: 'A client has matte-black powder-coated wheels. Which product choice creates the same risk covered in the Matte & Satin Finish Care module?', opts: ['A pH-neutral wheel cleaner', 'A glossy tyre dressing or standard wheel sealant applied without care near the coated surface', 'Using a soft wheel brush instead of a stiff one', 'Rinsing with plain water before applying product'], correct: 1, feedback: ['A pH-neutral cleaner carries no gloss-related risk.', 'Correct. Glossy dressing or sealant products can leave a visible sheen on a matte/satin finish, exactly like the overspray risk on matte paint.', 'A soft brush is a safety choice, not a risk factor.', 'A plain water rinse carries no gloss risk at all.'] }
    ]
  },
